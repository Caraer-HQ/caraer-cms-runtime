name: Verify developer contract publication
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-ready:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.registry.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: registry
        name: Check whether this commit has actually been published
        env:
          PACKAGE_NAME: "@caraer/cms-runtime"
        run: |
          python3 - <<'PYTHON'
          import json, os, urllib.error, urllib.parse, urllib.request
          version = json.load(open('package.json'))['version']
          url = 'https://registry.npmjs.org/' + urllib.parse.quote(os.environ['PACKAGE_NAME'], safe='') + '/' + version
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  published = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              published = {}
          ready = published.get('gitHead') == os.environ['GITHUB_SHA']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready=' + str(ready).lower() + '\n')
          print('Publication verified for this commit' if ready else 'This commit is not the published package; no release receipt needed')
          PYTHON
  verify-publication:
    needs: publication-ready
    if: needs.publication-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the public npm version belongs to this source
        run: |
          release_version="$(python -c 'import json; print(json.load(open("package.json"))["version"])')"
          python scripts/record_developer_release.py --kind npm --package @caraer/cms-runtime --version "$release_version" --output developer-release-package.json
      - uses: actions/upload-artifact@v4
        with:
          name: developer-release-package
          path: developer-release-package.json
          retention-days: 90
      - name: Notify developer documentation assessment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN || secrets.CARAER_HQ_GITHUB_TOKEN }}
        run: |
          printf '%s' '{"event_type":"developer-release"}' | gh api --method POST repos/Caraer-HQ/caraer-developer/dispatches --input -
